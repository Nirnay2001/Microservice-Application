apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: app01
spec:
  selector:
    matchLabels:
      name: myapp
  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
        - name: myapp
          image:  nirnay2001/micro-app:latest
          ports:
          - name:  http
            containerPort: 8080
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 100m